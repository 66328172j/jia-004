<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('导出检验台账')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">

                <div class="layui-form-item">
                    <label class="layui-form-label">开始日期</label>
                    <div class="layui-input-block">
                        <input type="text" id="beginDate" name="beginDate" lay-verify="required"
                               placeholder="yyyy-MM-dd" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">结束日期</label>
                    <div class="layui-input-block">
                        <input type="text" id="endDate" name="endDate" lay-verify="required"
                               placeholder="yyyy-MM-dd" autocomplete="off" class="layui-input" readonly>
                        <div class="layui-form-mid layui-word-aux">按报检日期归集，起止两天都算在内</div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">检验类型</label>
                    <div class="layui-input-block">
                        <select name="checkType">
                            <option value="">全部</option>
                            <option value="出厂">出厂</option>
                            <option value="到货">到货</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <div class="layui-form-mid layui-word-aux">导出批次号、导出条数、导出人、导出时间由系统自动记录</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="sampExport-save">
                <i class="layui-icon layui-icon-ok"></i>
                导出
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    layui.use(['form', 'laydate', 'jquery'], function () {
        let form = layui.form;
        let laydate = layui.laydate;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath+"/SampExportController";

        laydate.render({elem: '#beginDate', trigger: 'click', type: 'date'});
        laydate.render({elem: '#endDate', trigger: 'click', type: 'date'});

        //导出
        form.on('submit(sampExport-save)', function (data) {
            let loader = layer.load();
            $.ajax({
                url: MODULE_PATH+'/export',
                data: data.field,
                dataType: 'json',
                contentType: 'application/x-www-form-urlencoded',
                type: 'post',
                success: function (result) {
                    layer.close(loader);
                    if (result.code==200) {
                        // 导出成功立即下载文件；记录已留痕，之后可在列表重新下载
                        window.location.href = MODULE_PATH + '/download?id=' + result.data.id;
                        layer.msg(result.msg, {icon: 1, time: 1500}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                            parent.layui.table.reload("sampExport-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1500});
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
</html>
