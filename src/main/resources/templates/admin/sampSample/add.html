<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('样本检测结果录入')"/>
</head>
<body>
<form class="layui-form">
    <input type="hidden" name="lotId" th:value="${lotId}">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">

                <div class="layui-form-item" th:if="${lot != null}">
                    <label class="layui-form-label">检验批</label>
                    <div class="layui-input-block">
                        <div class="layui-form-mid">
                            <b th:text="${lot.lotNo}"></b>
                            <span th:text="${lot.productName}"></span>
                            （应抽 <b th:text="${lot.sampleSize}"></b> 个，已录 <b th:text="${recordedCount}"></b> 个）
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">样本编号</label>
                    <div class="layui-input-block">
                        <input type="text" th:value="${nextNo}" readonly class="layui-input layui-bg-gray">
                        <div class="layui-form-mid layui-word-aux" th:if="${nextNo != null}">编号按检验批应抽样本量自动生成 S01..Sn，保存生效</div>
                        <div class="layui-form-mid layui-word-aux" th:if="${nextNo == null}">该检验批样本已录满（或检验批不存在），不能继续录入</div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">检测项编码</label>
                    <div class="layui-input-block">
                        <input type="text" name="itemCode" lay-verify="required" autocomplete="off" placeholder="检测项编码" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">检测项名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="itemName" lay-verify="required" autocomplete="off" placeholder="检测项名称" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">标准值</label>
                    <div class="layui-input-block">
                        <input type="text" name="stdValue" lay-verify="required" autocomplete="off" placeholder="标准值/判定依据" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">实测值</label>
                    <div class="layui-input-block">
                        <input type="text" name="measuredValue" lay-verify="required" autocomplete="off" placeholder="实测值" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">单项判定</label>
                    <div class="layui-input-block">
                        <input type="radio" name="itemResult" value="0" title="合格" checked>
                        <input type="radio" name="itemResult" value="1" title="不合格">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">检测信息</label>
                    <div class="layui-input-block">
                        <div class="layui-form-mid layui-word-aux">检测人取当前登录人，检测时间取保存时间，由系统自动记录</div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入备注" name="remark" class="layui-textarea"></textarea>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="sampSample-save"
                    th:disabled="${nextNo == null}">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/SampSampleController";

        //保存
        form.on('submit(sampSample-save)', function (data) {
            let loader = layer.load();
            $.ajax({
                url: MODULE_PATH + '/add',
                data: data.field,
                dataType: 'json',
                contentType: 'application/x-www-form-urlencoded',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                            parent.layui.table.reload("sampSample-table");
                            //从检验批列表逐层进入时，连带刷新检验批汇总
                            try {
                                parent.parent.layui.table.reload("sampLot-table");
                            } catch (e) {
                            }
                            layer.close(loader);
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 1500});
                        layer.close(loader);
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
</html>
