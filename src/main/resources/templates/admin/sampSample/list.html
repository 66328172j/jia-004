<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('样本检测记录列表')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">检验批</label>
                <div class="layui-input-inline">
                    <select name="lotId" id="lotId">
                        <option value="">全部检验批</option>
                        <option th:each="l : ${lots}" th:value="${l.id}"
                                th:selected="${lotId != null && lotId == l.id}"
                                th:text="${l.lotNo + '（' + (l.productName == null ? '' : l.productName) + '）'}"></option>
                    </select>
                </div>
                <label class="layui-form-label">样本编号</label>
                <div class="layui-input-inline">
                    <input type="text" name="sampleNo" placeholder="如 S01" class="layui-input">
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="sampSample-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="sampSample-table" lay-filter="sampSample-table"></table>
    </div>
</div>
</body>

<script type="text/html" id="sampSample-toolbar">
    <button shiro:hasPermission="system:sampSample:add" class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        录入检测结果
    </button>
    <button shiro:hasPermission="system:sampSample:remove" class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove">
        <i class="layui-icon layui-icon-delete"></i>
        删除
    </button>
    <button th:if="${lotId != null}" shiro:hasPermission="system:sampLot:view" class="pear-btn pear-btn-warming pear-btn-md" lay-event="lotView">
        <i class="layui-icon layui-icon-return"></i>
        返回检验批
    </button>
</script>

<script type="text/html" id="sampSample-bar">
    <button shiro:hasPermission="system:sampSample:edit" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="edit" title="修改"><i class="layui-icon layui-icon-edit"></i>
    </button>

    <button shiro:hasPermission="system:sampSample:remove" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove" title="删除"><i class="layui-icon layui-icon-delete"></i>
    </button>
</script>

<script type="text/html" id="sampSample-itemResult">
    {{# if (d.itemResult == 0) { }}
    <span class="layui-badge layui-bg-green">合格</span>
    {{# } else if (d.itemResult == 1) { }}
    <span class="layui-badge">不合格</span>
    {{# } }}
</script>

<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    layui.use(['table', 'form', 'jquery'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;

        let MODULE_PATH = rootPath+"/SampSampleController/";
        // 从检验批列表带入时默认只查该批，未带参时为 null（查全部）；
        // id 为雪花长整型，按字符串内联避免 JS 数字精度丢失
        let defaultLotId = /*[[${lotId != null ? lotId.toString() : null}]]*/ null;
        let cols = [
            [
                {type: 'checkbox'},
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '检验批号', field: 'lotNo', align: 'left'},
                {title: '样本编号', field: 'sampleNo', align: 'center', width: 90},
                {title: '检测项编码', field: 'itemCode', align: 'left'},
                {title: '检测项名称', field: 'itemName', align: 'left'},
                {title: '标准值', field: 'stdValue', align: 'left'},
                {title: '实测值', field: 'measuredValue', align: 'left'},
                {title: '单项判定', field: 'itemResult', align: 'center', templet: '#sampSample-itemResult'},
                {title: '检测人', field: 'checkBy', align: 'center'},
                {title: '检测时间', field: 'checkTime', align: 'center'},
                {title: '操作', toolbar: '#sampSample-bar', align: 'center', width: 110}
            ]
        ]

        //table表单列表
        table.render({
            elem: '#sampSample-table',
            url: MODULE_PATH + 'list',
            where: {lotId: defaultLotId ? defaultLotId : ''},
            page: true,
            method: 'get',
            cols: cols,
            skin: 'line',
            toolbar: '#sampSample-toolbar',
            defaultToolbar: [{
                layEvent: 'refresh',
                icon: 'layui-icon-refresh',
            }, 'filter', 'print', 'exports']
        });

        //table图标事件绑定
        table.on('tool(sampSample-table)', function (obj) {
            if (obj.event === 'remove') {
                window.remove(obj);
            } else if (obj.event === 'edit') {
                window.edit(obj);
            }
        });

        //table工具栏绑定
        table.on('toolbar(sampSample-table)', function (obj) {
            if (obj.event === 'add') {
                window.add();
            } else if (obj.event === 'refresh') {
                window.refresh();
            } else if (obj.event === 'batchRemove') {
                window.batchRemove(obj);
            } else if (obj.event === 'lotView') {
                window.location.href = rootPath + '/SampLotController/view';
            }
        });

        //查询按钮绑定
        form.on('submit(sampSample-query)', function (data) {
            table.reload('sampSample-table', {page: {curr: 1}, where: data.field})
            return false;
        });

        //录入检测结果：必须先选定检验批，样本编号按该批应抽样本量生成
        window.add = function () {
            let lotId = $('#lotId').val();
            if (!lotId) {
                layer.msg("请先在查询区选择检验批", {icon: 3, time: 1000});
                return false;
            }
            layer.open({
                type: 2,
                title: '录入样本检测结果',
                shade: 0.1,
                area: ['500px', '600px'],
                content: MODULE_PATH + 'add?lotId=' + lotId
            });
        }
        //修改
        window.edit = function (obj) {
            layer.open({
                type: 2,
                title: '修改样本检测结果',
                shade: 0.1,
                area: ['500px', '600px'],
                content: MODULE_PATH + 'edit/' + obj.data['id']
            });
        }
        //删除
        window.remove = function (obj) {
            layer.confirm('确定要删除该样本检测记录', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + "remove?ids=" + obj.data['id'],
                    dataType: 'json',
                    type: 'delete',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code==200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                table.reload('sampSample-table');
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2, time: 1000});
                        }
                    }
                })
            });
        }

        //批量删除
        window.batchRemove = function (obj) {
            let data = table.checkStatus(obj.config.id).data;
            if (data.length === 0) {
                layer.msg("未选中数据", {icon: 3, time: 1000});
                return false;
            }
            let ids = "";
            for (let i = 0; i < data.length; i++) {
                ids += data[i].id + ",";
            }
            ids = ids.substr(0, ids.length - 1);
            layer.confirm('确定要删除这些样本检测记录', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + "remove?ids=" + ids,
                    dataType: 'json',
                    type: 'delete',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code==200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                table.reload('sampSample-table');
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2, time: 1000});
                        }
                    }
                })
            });
        }
        //刷新按钮
        window.refresh = function () {
            table.reload('sampSample-table');
        }
    })
</script>
</html>
