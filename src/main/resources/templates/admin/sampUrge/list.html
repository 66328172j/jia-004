<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('催办记录列表')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">检验批</label>
                <div class="layui-input-inline">
                    <select name="lotId" id="lotId">
                        <option value="">全部检验批</option>
                        <option th:each="l : ${lots}" th:value="${l.id}"
                                th:selected="${lotId != null && lotId == l.id}"
                                th:text="${l.lotNo + '（' + (l.productName == null ? '' : l.productName) + '）'}"></option>
                    </select>
                </div>
                <label class="layui-form-label">催办单号</label>
                <div class="layui-input-inline">
                    <input type="text" name="urgeNo" placeholder="催办单号" class="layui-input">
                </div>
                <label class="layui-form-label">超期</label>
                <div class="layui-input-inline">
                    <select name="onlyOverdue">
                        <option value="">全部</option>
                        <option value="1">只看还在超期</option>
                    </select>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="sampUrge-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="sampUrge-table" lay-filter="sampUrge-table"></table>
    </div>
</div>
</body>

<script type="text/html" id="sampUrge-toolbar">
    <button shiro:hasPermission="system:sampUrge:add" class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        发起催办
    </button>
    <button shiro:hasPermission="system:sampUrge:remove" class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove">
        <i class="layui-icon layui-icon-delete"></i>
        删除
    </button>
    <button th:if="${lotId != null}" shiro:hasPermission="system:sampLot:view" class="pear-btn pear-btn-warming pear-btn-md" lay-event="lotView">
        <i class="layui-icon layui-icon-return"></i>
        返回检验批
    </button>
</script>

<script type="text/html" id="sampUrge-bar">
    <button shiro:hasPermission="system:sampUrge:remove" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove" title="删除"><i class="layui-icon layui-icon-delete"></i>
    </button>
</script>

<script type="text/html" id="sampUrge-overdueDays">
    {{# if (d.overdueDays > 0) { }}
    <span class="layui-badge layui-bg-red">超期 {{d.overdueDays}} 天</span>
    {{# } else { }}
    <span class="layui-word-aux">-</span>
    {{# } }}
</script>

<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    layui.use(['table', 'form', 'jquery'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;

        let MODULE_PATH = rootPath+"/SampUrgeController/";
        // 从检验批列表带入时默认只查该批，未带参时为 null（查全部）；
        // id 为雪花长整型，按字符串内联避免 JS 数字精度丢失
        let defaultLotId = /*[[${lotId != null ? lotId.toString() : null}]]*/ null;
        let cols = [
            [
                {type: 'checkbox'},
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '检验批号', field: 'lotNo', align: 'left'},
                {title: '产品名称', field: 'productName', align: 'left'},
                {title: '催办单号', field: 'urgeNo', align: 'left'},
                {title: '催办次数', field: 'urgeCount', align: 'center'},
                {title: '超期天数', field: 'overdueDays', align: 'center', templet: '#sampUrge-overdueDays'},
                {title: '催办人', field: 'urgeBy', align: 'center'},
                {title: '催办时间', field: 'urgeTime', align: 'center'},
                {title: '备注', field: 'remark', align: 'left'},
                {title: '创建时间', field: 'createTime', align: 'center'},
                {title: '操作', toolbar: '#sampUrge-bar', align: 'center', width: 80}
            ]
        ]

        //table表单列表
        table.render({
            elem: '#sampUrge-table',
            url: MODULE_PATH + 'list',
            where: {lotId: defaultLotId ? defaultLotId : ''},
            page: true,
            method: 'get',
            cols: cols,
            skin: 'line',
            toolbar: '#sampUrge-toolbar',
            defaultToolbar: [{
                layEvent: 'refresh',
                icon: 'layui-icon-refresh',
            }, 'filter', 'print', 'exports']
        });

        //table图标事件绑定
        table.on('tool(sampUrge-table)', function (obj) {
            if (obj.event === 'remove') {
                window.remove(obj);
            }
        });

        //table工具栏绑定
        table.on('toolbar(sampUrge-table)', function (obj) {
            if (obj.event === 'add') {
                window.add();
            } else if (obj.event === 'refresh') {
                window.refresh();
            } else if (obj.event === 'batchRemove') {
                window.batchRemove(obj);
            } else if (obj.event === 'lotView') {
                window.location.href = rootPath + '/SampLotController/view';
            }
        });

        //查询按钮绑定
        form.on('submit(sampUrge-query)', function (data) {
            table.reload('sampUrge-table', {page: {curr: 1}, where: data.field})
            return false;
        });

        //发起催办：检验批在查询区选定则带入，不选则在弹窗里挑
        window.add = function () {
            let lotId = $('#lotId').val();
            layer.open({
                type: 2,
                title: '发起催办',
                shade: 0.1,
                area: ['500px', '520px'],
                content: MODULE_PATH + 'add' + (lotId ? '?lotId=' + lotId : '')
            });
        }
        //删除
        window.remove = function (obj) {
            layer.confirm('确定要删除该催办记录', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + "remove?ids=" + obj.data['id'],
                    dataType: 'json',
                    type: 'delete',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code==200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                obj.del();
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2, time: 1000});
                        }
                    }
                })
            });
        }

        //批量删除
        window.batchRemove = function (obj) {
            let data = table.checkStatus(obj.config.id).data;
            if (data.length === 0) {
                layer.msg("未选中数据", {icon: 3, time: 1000});
                return false;
            }
            let ids = "";
            for (let i = 0; i < data.length; i++) {
                ids += data[i].id + ",";
            }
            ids = ids.substr(0, ids.length - 1);
            layer.confirm('确定要删除这些催办记录', {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: MODULE_PATH + "remove?ids=" + ids,
                    dataType: 'json',
                    type: 'delete',
                    success: function (result) {
                        layer.close(loading);
                        if (result.code==200) {
                            layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                                table.reload('sampUrge-table');
                            });
                        } else {
                            layer.msg(result.msg, {icon: 2, time: 1000});
                        }
                    }
                })
            });
        }
        //刷新按钮
        window.refresh = function () {
            table.reload('sampUrge-table');
        }
    })
</script>
</html>
